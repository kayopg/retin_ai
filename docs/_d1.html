<title>RetinAI para Dr. Miguel</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{
  --bg:#F1F4FA; --paper:#FFFFFF; --paper-2:#F7F9FD; --paper-3:#E7ECF7;
  --line:#D6DEEC; --line-soft:#E7ECF6;
  --ink:#0E1626; --ink-2:#37435A; --muted:#69758A;
  --brand:#2F5BD8; --brand-soft:#E5EBFB; --brand-line:#BCCBF4;
  --crit:#BE3247; --crit-soft:#FBE6EA; --crit-line:#F0C0C9;
  --warn:#8F5A05; --warn-soft:#FAEFD8; --warn-line:#EBD1A0;
  --ok:#06735C;   --ok-soft:#DCF1EB;   --ok-line:#ABDACE;
  --ai:#5C3CBE;   --ai-soft:#EAE5FB;   --ai-line:#CBBCF2;
  --hi-bg:#0D1424; --hi-ink:#F1F4FA; --hi-mut:#94A2BE; --hi-line:#28344F;
  --hi-brand:#8FAAFF; --hi-crit:#FF8497; --hi-ok:#4CD5B0; --hi-warn:#F2B65F;
  --sh:0 1px 2px rgba(14,22,38,.05), 0 14px 34px -22px rgba(14,22,38,.34);
  --f-d:"Instrument Serif",Georgia,"Times New Roman",serif;
  --f-s:"IBM Plex Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,"Cascadia Mono",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#070C18; --paper:#0F1729; --paper-2:#141E36; --paper-3:#1C2745;
    --line:#26324F; --line-soft:#1B2540;
    --ink:#E8EDF7; --ink-2:#B7C2D8; --muted:#8492AD;
    --brand:#7C9CFF; --brand-soft:#182448; --brand-line:#2C3D70;
    --crit:#FF8497; --crit-soft:#331420; --crit-line:#5A2436;
    --warn:#F2B65F; --warn-soft:#2F2312; --warn-line:#553D18;
    --ok:#4CD5B0;   --ok-soft:#0C2B26;   --ok-line:#1B4A41;
    --ai:#B9A2FF;   --ai-soft:#211B40;   --ai-line:#3B2F66;
    --hi-bg:#151F3A; --hi-ink:#E8EDF7; --hi-mut:#93A2C0; --hi-line:#2C3A5C;
    --hi-brand:#9DB4FF; --hi-crit:#FF97A8; --hi-ok:#5EDCBA; --hi-warn:#F5C176;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -24px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#070C18; --paper:#0F1729; --paper-2:#141E36; --paper-3:#1C2745;
  --line:#26324F; --line-soft:#1B2540;
  --ink:#E8EDF7; --ink-2:#B7C2D8; --muted:#8492AD;
  --brand:#7C9CFF; --brand-soft:#182448; --brand-line:#2C3D70;
  --crit:#FF8497; --crit-soft:#331420; --crit-line:#5A2436;
  --warn:#F2B65F; --warn-soft:#2F2312; --warn-line:#553D18;
  --ok:#4CD5B0;   --ok-soft:#0C2B26;   --ok-line:#1B4A41;
  --ai:#B9A2FF;   --ai-soft:#211B40;   --ai-line:#3B2F66;
  --hi-bg:#151F3A; --hi-ink:#E8EDF7; --hi-mut:#93A2C0; --hi-line:#2C3A5C;
  --hi-brand:#9DB4FF; --hi-crit:#FF97A8; --hi-ok:#5EDCBA; --hi-warn:#F5C176;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -24px rgba(0,0,0,.9);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-s);line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:3px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ── PALCO ── */
.deck{height:100%;position:relative}
.slide{position:absolute;inset:0;display:none;overflow-y:auto;overflow-x:hidden;padding:clamp(18px,3.4vh,44px) clamp(18px,4vw,64px) clamp(64px,9vh,88px)}
.slide.on{display:grid;align-content:center;animation:in .34s cubic-bezier(.2,.75,.3,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.in{width:min(1200px,100%);margin:0 auto}
.slide.hi{background:var(--hi-bg);color:var(--hi-ink)}
.slide.hi .eyebrow{color:var(--hi-brand)}
.slide.hi .eyebrow::after{background:var(--hi-line)}
.slide.hi .lead{color:var(--hi-mut)}
.slide.hi .card{background:rgba(255,255,255,.045);border-color:var(--hi-line)}
.slide.hi .card p,.slide.hi .card .d{color:var(--hi-mut)}
.slide.hi .kicker{color:var(--hi-mut)}
.slide.hi .rule{background:var(--hi-line)}

/* ── TIPOGRAFIA ── */
.eyebrow{font-family:var(--f-m);font-size:clamp(10px,1.15vw,12.5px);font-weight:600;letter-spacing:.17em;text-transform:uppercase;color:var(--brand);display:flex;align-items:center;gap:12px;margin-bottom:clamp(12px,2vh,22px)}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line);max-width:160px}
h1{font-family:var(--f-d);font-weight:400;font-size:clamp(46px,8.4vw,110px);line-height:.94;letter-spacing:-.03em;text-wrap:balance}
h1 em{font-style:italic;color:var(--brand)}
.slide.hi h1 em{color:var(--hi-brand)}
h2{font-family:var(--f-d);font-weight:400;font-size:clamp(27px,4.3vw,54px);line-height:1.07;letter-spacing:-.022em;text-wrap:balance;max-width:19em}
h2 em{font-style:italic;color:var(--brand)}
.slide.hi h2 em{color:var(--hi-brand)}
h3{font-size:clamp(15px,1.5vw,19px);font-weight:600;letter-spacing:-.01em}
.lead{font-size:clamp(15.5px,1.75vw,22px);line-height:1.55;color:var(--ink-2);max-width:34em;margin-top:clamp(12px,2vh,22px);text-wrap:pretty}
.kicker{font-size:clamp(13px,1.3vw,16.5px);color:var(--muted);margin-top:clamp(14px,2.4vh,26px);max-width:44em;line-height:1.6}
.big{font-family:var(--f-m);font-size:clamp(30px,5.6vw,72px);font-weight:600;letter-spacing:-.05em;line-height:1}
.rule{height:1px;background:var(--line);margin:clamp(16px,2.6vh,30px) 0}
strong{font-weight:600;color:inherit}
em.i{font-style:italic}

/* ── CARTÕES ── */
.cards{display:grid;gap:clamp(10px,1.5vw,16px);margin-top:clamp(18px,3vh,32px)}
.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.c4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:860px){.c3,.c4{grid-template-columns:1fr}.c2{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(14px,1.5vw,20px);box-shadow:var(--sh);min-width:0;display:flex;flex-direction:column;gap:8px}
.card h3{display:flex;align-items:baseline;gap:9px}
.card p{font-size:clamp(13px,1.2vw,15.5px);line-height:1.58;color:var(--ink-2);margin:0}
.card .d{font-size:clamp(12.5px,1.15vw,15px);line-height:1.55;color:var(--muted)}
.card.b{border-left:3px solid var(--brand)}
.card.c{border-left:3px solid var(--crit)}
.card.w{border-left:3px solid var(--warn)}
.card.o{border-left:3px solid var(--ok)}
.card.a{border-left:3px solid var(--ai)}

.tag{display:inline-flex;align-items:center;gap:5px;font-family:var(--f-m);font-size:clamp(9.5px,.95vw,11.5px);font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--paper-3);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.tag.b{background:var(--brand-soft);color:var(--brand);border-color:var(--brand-line)}
.tag.c{background:var(--crit-soft);color:var(--crit);border-color:var(--crit-line)}
.tag.w{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.tag.o{background:var(--ok-soft);color:var(--ok);border-color:var(--ok-line)}
.tag.a{background:var(--ai-soft);color:var(--ai);border-color:var(--ai-line)}
.slide.hi .tag{background:rgba(255,255,255,.07);border-color:var(--hi-line);color:var(--hi-mut)}
.slide.hi .tag.c{background:rgba(255,132,151,.13);color:var(--hi-crit);border-color:rgba(255,132,151,.3)}
.slide.hi .tag.o{background:rgba(76,213,176,.13);color:var(--hi-ok);border-color:rgba(76,213,176,.3)}
.slide.hi .tag.b{background:rgba(143,170,255,.13);color:var(--hi-brand);border-color:rgba(143,170,255,.3)}

/* ── LISTAS ── */
ul.pts{list-style:none;display:flex;flex-direction:column;gap:clamp(8px,1.3vh,14px);margin-top:clamp(14px,2.4vh,26px)}
ul.pts li{padding-left:26px;position:relative;font-size:clamp(14px,1.35vw,18px);line-height:1.55;color:var(--ink-2);max-width:42em}
ul.pts li::before{content:"";position:absolute;left:5px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--brand)}
.slide.hi ul.pts li{color:var(--hi-mut)}
.slide.hi ul.pts li::before{background:var(--hi-brand)}
ul.pts li b{color:var(--ink);font-weight:600}
.slide.hi ul.pts li b{color:var(--hi-ink)}

/* ── ANTES / DEPOIS ── */
.ba{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5vw,16px);margin-top:clamp(16px,2.6vh,28px);align-items:stretch}
@media (max-width:860px){.ba{grid-template-columns:1fr}}
.pane{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.pane-h{padding:9px 14px;border-bottom:1px solid var(--line-soft);background:var(--paper-2);font-size:clamp(11px,1.05vw,13px);font-weight:600;color:var(--muted);display:flex;align-items:center;gap:8px}
.pane-b{padding:clamp(12px,1.3vw,17px);flex:1}
.raw{font-family:var(--f-m);font-size:clamp(10.5px,1.02vw,13px);line-height:1.75;color:var(--ink-2);white-space:pre-wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:clamp(11.5px,1.08vw,14px);align-items:baseline}
.kv dt{color:var(--muted)}
.kv dd{font-family:var(--f-m);font-weight:500;letter-spacing:-.01em}
.blk{margin-bottom:11px}
.blk:last-child{margin-bottom:0}
.blk-t{font-family:var(--f-m);font-size:clamp(9px,.92vw,10.5px);font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.blk p{font-size:clamp(11.5px,1.08vw,14px);line-height:1.55;color:var(--ink-2)}

/* ── FLUXO ── */
.flow{display:grid;gap:clamp(9px,1.2vw,14px);margin-top:clamp(16px,2.6vh,30px)}
.f3{grid-template-columns:repeat(3,minmax(0,1fr))}
.f5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media (max-width:900px){.f3,.f5{grid-template-columns:1fr}}
.step{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:clamp(12px,1.3vw,17px);position:relative;box-shadow:var(--sh);min-width:0}
.slide.hi .step{background:rgba(255,255,255,.05);border-color:var(--hi-line);box-shadow:none}
.step-n{font-family:var(--f-m);font-size:clamp(9.5px,.95vw,11.5px);font-weight:600;letter-spacing:.09em;color:var(--brand)}
.slide.hi .step-n{color:var(--hi-brand)}
.step-t{font-size:clamp(13.5px,1.3vw,17px);font-weight:600;margin:6px 0 5px;line-height:1.3}
.step-d{font-size:clamp(12px,1.1vw,14.5px);color:var(--muted);line-height:1.5}
.slide.hi .step-d{color:var(--hi-mut)}
.step.hot{background:var(--crit-soft);border-color:var(--crit-line)}
.step.hot .step-n{color:var(--crit)}
.slide.hi .step.hot{background:rgba(255,132,151,.11);border-color:rgba(255,132,151,.3)}
.slide.hi .step.hot .step-n{color:var(--hi-crit)}
.slide.hi .step.hot .step-d{color:#E4B7BF}

/* ── CIRCUITO ── */
.loop{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:clamp(8px,1vw,14px);align-items:stretch;margin-top:clamp(16px,2.6vh,30px)}
@media (max-width:900px){.loop{grid-template-columns:1fr}.loop .arr{transform:rotate(90deg);justify-self:center}}
.arr{display:grid;place-items:center;color:var(--muted);font-size:20px;line-height:1}
.box{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:clamp(13px,1.4vw,18px);box-shadow:var(--sh);display:flex;flex-direction:column;gap:7px;min-width:0}
.box-l{font-family:var(--f-m);font-size:clamp(9.5px,.95vw,11.5px);font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--brand)}
.box h3{font-size:clamp(14px,1.35vw,18px)}
.box p{font-size:clamp(12px,1.12vw,14.5px);color:var(--muted);line-height:1.5}
.back{margin-top:clamp(10px,1.6vh,16px);border:1px dashed var(--line);border-radius:11px;padding:10px 14px;font-size:clamp(12px,1.12vw,14.5px);color:var(--muted);text-align:center;line-height:1.5}

/* ── CONVERSA ── */
.chat{display:flex;flex-direction:column;gap:9px;background:var(--paper-2);border:1px solid var(--line);border-radius:14px;padding:clamp(12px,1.4vw,18px)}
.msg{max-width:84%;padding:9px 13px;border-radius:14px;font-size:clamp(12px,1.12vw,14.5px);line-height:1.5;border:1px solid var(--line);background:var(--paper)}
.msg.out{align-self:flex-end;background:var(--brand-soft);border-color:var(--brand-line);border-bottom-right-radius:5px}
.msg.in{align-self:flex-start;border-bottom-left-radius:5px}
.msg.alarm{background:var(--crit-soft);border-color:var(--crit-line);color:var(--crit);font-weight:500}
.msg-t{font-family:var(--f-m);font-size:10px;color:var(--muted);margin-top:5px}

/* ── FILA ── */
.queue{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--sh)}
.q-bar{display:flex;gap:2px;height:8px}
.q-bar i{display:block}
.q-row{display:flex;align-items:center;gap:clamp(9px,1.1vw,14px);padding:clamp(9px,1.1vw,13px) clamp(12px,1.4vw,17px);border-bottom:1px solid var(--line-soft)}
.q-row:last-child{border-bottom:0}
.q-row.c{border-left:3px solid var(--crit)}
.q-row.w{border-left:3px solid var(--warn)}
.q-av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-m);font-size:11px;font-weight:700;flex-shrink:0}
.q-av.c{background:var(--crit-soft);color:var(--crit)}
.q-av.w{background:var(--warn-soft);color:var(--warn)}
.q-m{flex:1;min-width:0}
.q-n{font-size:clamp(12.5px,1.18vw,15px);font-weight:600}
.q-d{font-size:clamp(11.5px,1.08vw,13.5px);color:var(--muted);line-height:1.45;margin-top:2px}
.q-s{font-family:var(--f-m);font-size:clamp(14px,1.5vw,19px);font-weight:600;letter-spacing:-.04em;flex-shrink:0}

/* ── COFRES ── */
.vaults{display:grid;grid-template-columns:1fr auto 1fr;gap:clamp(10px,1.4vw,18px);align-items:stretch;margin-top:clamp(16px,2.6vh,28px)}
@media (max-width:900px){.vaults{grid-template-columns:1fr}.vaults .arr{transform:rotate(90deg);justify-self:center}}
.vault{border-radius:14px;padding:clamp(13px,1.4vw,19px);display:flex;flex-direction:column;gap:9px;border:1px solid}
.vault.a{background:var(--crit-soft);border-color:var(--crit-line)}
.vault.b{background:var(--ai-soft);border-color:var(--ai-line)}
.slide.hi .vault.a{background:rgba(255,132,151,.1);border-color:rgba(255,132,151,.28)}
.slide.hi .vault.b{background:rgba(185,162,255,.1);border-color:rgba(185,162,255,.28)}
.vault h3{font-size:clamp(14px,1.35vw,18px)}
.vault ul{list-style:none;display:flex;flex-direction:column;gap:5px;font-size:clamp(12px,1.12vw,14.5px);line-height:1.5;color:var(--ink-2)}
.slide.hi .vault ul{color:var(--hi-mut)}
.vault li{padding-left:15px;position:relative}
.vault li::before{content:"";position:absolute;left:0;top:.6em;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.55}

/* ── FASES ── */
.phases{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,13px);margin-top:clamp(16px,2.6vh,30px)}
@media (max-width:980px){.phases{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.phases{grid-template-columns:1fr}}
.ph{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:clamp(12px,1.3vw,16px);display:flex;flex-direction:column;gap:7px;box-shadow:var(--sh);min-width:0}
.ph.last{background:var(--paper-2);border-style:dashed}
.ph-n{font-family:var(--f-m);font-size:clamp(9.5px,.95vw,11.5px);font-weight:600;letter-spacing:.08em;color:var(--brand)}
.ph.last .ph-n{color:var(--crit)}
.ph h3{font-size:clamp(13px,1.25vw,16px);line-height:1.3}
.ph p{font-size:clamp(11.5px,1.08vw,14px);color:var(--muted);line-height:1.5}
.ph .t{font-family:var(--f-m);font-size:clamp(11px,1.05vw,13px);color:var(--ink-2);font-weight:500;margin-top:auto;padding-top:7px}

/* ── TABELA ── */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:13px;background:var(--paper);margin-top:clamp(16px,2.6vh,28px);box-shadow:var(--sh)}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.12vw,15px);min-width:500px}
th{text-align:left;font-family:var(--f-m);font-size:clamp(9.5px,.92vw,11px);font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 15px;background:var(--paper-2);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 15px;border-bottom:1px solid var(--line-soft);vertical-align:top;line-height:1.5;color:var(--ink-2)}
tr:last-child td{border-bottom:0}
td b{color:var(--ink);font-weight:600}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}

/* ── DECISÕES ── */
.decs{display:flex;flex-direction:column;gap:clamp(7px,1vh,11px);margin-top:clamp(14px,2.4vh,26px)}
.dec{display:grid;grid-template-columns:auto 1fr auto;gap:clamp(10px,1.3vw,18px);align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:clamp(10px,1.15vw,15px) clamp(12px,1.4vw,18px);box-shadow:var(--sh)}
@media (max-width:820px){.dec{grid-template-columns:auto 1fr}.dec .rec{grid-column:2}}
.dec .q{font-family:var(--f-m);font-size:clamp(11px,1.05vw,13px);font-weight:600;color:var(--brand)}
.dec .t{font-size:clamp(12.5px,1.2vw,15.5px);font-weight:500;line-height:1.4}
.dec .rec{font-size:clamp(11.5px,1.1vw,14px);color:var(--ok);font-weight:600;text-align:right;line-height:1.4}

/* ── CTA ── */
.cta{display:inline-flex;align-items:center;gap:9px;margin-top:clamp(18px,3vh,30px);padding:12px 20px;border-radius:11px;background:var(--brand);color:var(--bg);font-size:clamp(13.5px,1.3vw,16px);font-weight:600;text-decoration:none}
.slide.hi .cta{background:var(--hi-brand);color:var(--hi-bg)}
.cta:hover{filter:brightness(1.1)}
.sig{font-family:var(--f-m);font-size:clamp(11px,1.05vw,13px);color:var(--muted);margin-top:clamp(20px,3.4vh,36px);display:flex;flex-wrap:wrap;gap:6px 24px}
.slide.hi .sig{color:var(--hi-mut)}
.sig b{color:var(--ink-2);font-weight:500}
.slide.hi .sig b{color:var(--hi-ink)}

/* ── CONTROLES ── */
